<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractory</title>
<style>
:root {
  --c1: #1f6f78; --c2: #b3541e; --c3: #6b4fa3; --c4: #8a7a00; --c5: #b02e6c; --c6: #3a7d2c;
  --bg: #f4f5f3; --card: #ffffff; --text: #1b2124; --muted: #5d6a6e; --line: #d3d9d7;
  --accent: #1f6f78; --bad: #b3261e; --warn: #8a5300; --ok: #1d7a45;
  --shadow: 0 1px 2px rgba(27, 33, 36, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --c1: #4ab3be; --c2: #f0a070; --c3: #b9a3f0; --c4: #d8c860; --c5: #f08ab8; --c6: #7fd070;
    --bg: #1b2124; --card: #2b3539; --text: #e8ecea; --muted: #a0aeb2; --line: #36434a;
    --accent: #4ab3be; --bad: #ff8a7d; --warn: #e3a35f; --ok: #5fd08f; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
h1 { margin: 0; font-size: 18px; font-weight: 650; }
h1 span { color: var(--accent); }
h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
h2 b { color: var(--text); font-variant-numeric: tabular-nums; }
main { padding: 0 16px 28px; max-width: 1100px; margin: 0 auto; }
section { margin-top: 20px; }
a { color: var(--accent); }
.live { font-size: 12px; color: var(--muted); }
.live.on { color: var(--ok); }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 0 16px; max-width: 1100px; }
@media (min-width: 1132px) { .strip { margin: 0 auto; } }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-shadow: var(--shadow); min-width: 0; }
.tile small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
.tile b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile.bad { border-color: var(--bad); } .tile.bad b { color: var(--bad); }
.tile.warn b { color: var(--warn); }
.tile.ok b { color: var(--ok); }
.tile code { font: 13px ui-monospace, Menlo, monospace; }
.item { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.item.stuck { border-left-color: var(--bad); }
.item .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.item .title { font-weight: 600; overflow-wrap: anywhere; }
.item .repo, .item .age { color: var(--muted); font-size: 12px; }
.item .reason { margin: 4px 0; overflow-wrap: anywhere; }
.item .links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.item code { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
.raw { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
.raw summary { cursor: pointer; }
.empty { color: var(--muted); padding: 8px 2px; }

.stages { display: flex; gap: 2px; margin: 6px 0 2px; }
.stg { flex: 1 1 0; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; font-size: 11px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.stg b { display: block; font-weight: 500; font-variant-numeric: tabular-nums; }
.stg.now { background: var(--accent); border-color: var(--accent); color: #fff; }
.stg.idle { opacity: .55; }
.mark { display: inline-block; font-size: 11px; border: 1px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 0 6px; margin-left: 4px; }
.repo-h { margin: 12px 0 6px; font-size: 13px; font-weight: 650; }
.job { cursor: pointer; border-left-color: var(--accent); }
.job:hover, .job:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.q { display: flex; justify-content: space-between; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--line); }
.q .why { color: var(--muted); text-align: right; overflow-wrap: anywhere; }
.q .why.bad { color: var(--bad); }
details.done > summary { cursor: pointer; }
.done-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
#drawer { position: fixed; inset: 0 0 0 auto; width: min(520px, 100%); background: var(--card); border-left: 1px solid var(--line); box-shadow: -4px 0 16px rgba(0,0,0,.2); padding: 14px 16px; overflow-y: auto; transform: translateX(105%); transition: transform .15s; z-index: 5; }
#drawer.open { transform: none; }
#drawer h3 { margin: 0 28px 4px 0; font-size: 16px; overflow-wrap: anywhere; }
#drawer .close { position: absolute; top: 10px; right: 12px; border: 0; background: none; color: var(--text); font-size: 22px; cursor: pointer; }
.ev { display: grid; grid-template-columns: 78px 1fr; gap: 2px 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.ev time { color: var(--muted); font-variant-numeric: tabular-nums; }
.ev .note { grid-column: 2; color: var(--muted); overflow-wrap: anywhere; }
.verdict { border-left: 3px solid var(--bad); padding: 2px 8px; margin: 6px 0; font-size: 13px; }
.verdict.approved { border-left-color: var(--ok); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto; }
.seg button { font: inherit; font-size: 12px; background: var(--card); color: var(--text); border: 0; padding: 4px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 650; }
h3 { margin: 16px 0 6px; font-size: 13px; font-weight: 650; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
button.tile { font: inherit; color: inherit; text-align: left; cursor: help; width: 100%; }
button.tile .hint { display: none; margin-top: 4px; font-size: 12px; font-weight: 400; color: var(--muted); }
button.tile.show .hint { display: block; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow); overflow-x: auto; }
.panel svg { display: block; width: 100%; height: auto; max-width: 720px; }
.panel svg text { fill: var(--muted); font: 10px system-ui, sans-serif; }
.panel svg text.val { fill: var(--text); }
.panel svg .axis { stroke: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
.legend button { font: inherit; font-size: 12px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; cursor: pointer; }
.legend button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.sum { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
table.t th, table.t td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
table.t th { color: var(--muted); font-weight: 500; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Frac<span>tory</span></h1>
  <span class="live" id="live">○ offline</span>
</header>
<div class="strip" id="strip" aria-label="Saúde da fábrica"></div>
<main>
  <section id="flow" aria-labelledby="flow-h"><h2 id="flow-h">Em andamento <b id="flow-n">–</b></h2><div id="flow-list"></div></section>
  <section id="queue" aria-labelledby="queue-h"><h2 id="queue-h">Fila <b id="queue-n">–</b></h2><div id="queue-list"></div></section>
  <section id="needs" aria-labelledby="needs-h"><h2 id="needs-h">Precisa de você <b id="needs-n">–</b></h2><div id="needs-list"></div></section>
  <section id="stuck" aria-labelledby="stuck-h"><h2 id="stuck-h">Parado <b id="stuck-n">–</b></h2><div id="stuck-list"></div></section>
  <section id="done" aria-labelledby="done-h"><details class="done"><summary><h2 id="done-h" style="display:inline-flex">Concluídos <b id="done-n">–</b></h2></summary><div id="done-list"></div></details></section>
  <section id="work" aria-labelledby="work-h">
    <h2 id="work-h">Como estamos trabalhando
      <span class="seg" role="group" aria-label="Janela de tempo">
        <button type="button" data-window="7" aria-pressed="true">7 dias</button><button type="button" data-window="30" aria-pressed="false">30 dias</button>
      </span>
    </h2>
    <h3>Merges por dia</h3>
    <div class="panel"><div class="legend" id="w-legend"></div><div id="w-throughput"></div></div>
    <h3>Tempo</h3>
    <div class="grid" id="w-lead"></div>
    <div class="panel" style="margin-top:8px"><div id="w-stages"></div></div>
    <h3>Qualidade</h3>
    <div class="grid" id="w-quality"></div>
    <h3>Esperando por você</h3>
    <div class="panel" id="w-gates"></div>
    <h3>Custo por repo</h3>
    <div class="panel" id="w-cost"></div>
  </section>
</main>
<aside id="drawer" aria-label="Histórico do job" aria-hidden="true"></aside>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const link = (url, text) => (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : "");

let jobs = { jobs: [], wip: { open: 0, max: 0 } };
let health = { missing: true };
let stuck = [];
let metrics = { stage_minutes: {} };
let queue = { missing: true };
let openJob = null;

function ago(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s < 90) return `${s} s`;
  const m = Math.round(s / 60);
  if (m < 90) return `${m} min`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h} h` : `${Math.round(h / 24)} d`;
}
const ageOf = (iso) => (iso ? (Date.now() - Date.parse(iso)) / 1000 : 0);

// Portuguese wording comes from the server (fractory/pt.py): gate_text and reason_pt. The raw English detail only goes in <details>.
const rawDetail = (text) => (text ? `<details class="raw"><summary>detalhe</summary><code>${esc(text)}</code></details>` : "");

function tile(label, value, tone, icon) {
  return `<div class="tile ${tone || ""}"><small>${label}</small><b>${icon ? icon + " " : ""}${value}</b></div>`;
}

function renderStrip() {
  const gates = jobs.jobs.filter((j) => j.gate).length;
  const stuckN = stuck.length;
  const h = health;
  const watch = h.missing
    ? tile("Watch", "sem sinal", "bad", "✕")
    : h.alive
      ? tile("Watch", "ativo", "ok", "✓")
      : tile("Watch", "parado", "bad", "✕");
  const cycle = h.missing
    ? tile("Último ciclo", "–")
    : tile("Último ciclo", `há ${ago(ageOf(h.cycle_ended_at))} · ${ago(h.duration_seconds ?? 0)}`, h.alive ? "" : "bad", h.alive ? "" : "✕");
  const backoffs = h.missing ? tile("Backoffs Plane", "–") : tile("Backoffs Plane", h.rate_limit_backoffs ?? 0, h.rate_limit_backoffs ? "warn" : "", h.rate_limit_backoffs ? "⚠" : "");
  const wip = jobs.wip;
  $("strip").innerHTML = [
    watch,
    cycle,
    tile("WIP", `${wip.open} / ${wip.max}`, wip.max && wip.open >= wip.max ? "warn" : "", wip.max && wip.open >= wip.max ? "⚠" : ""),
    tile("Gates abertos", gates, gates ? "warn" : "", gates ? "⚠" : ""),
    tile("Parados", stuckN, stuckN ? "bad" : "", stuckN ? "✕" : ""),
    backoffs,
    tile("Código", h.missing || !h.code_sha ? "–" : `<code>${esc(h.code_sha.slice(0, 7))}</code>`),
  ].join("");
}

const prLink = (j) => (j.pr ? (j.pr_url ? link(j.pr_url, `PR #${esc(j.pr)}`) : `PR #${esc(j.pr)}`) : "");

function renderNeeds() {
  const open = jobs.jobs.filter((j) => j.gate).sort((a, b) => (a.gate_opened_at < b.gate_opened_at ? -1 : 1));
  $("needs-n").textContent = open.length;
  $("needs-list").innerHTML = open.map((j) => `<article class="item" data-id="${esc(j.id)}">
    <div class="top"><span class="title">${esc(j.title)}</span><span class="age">há ${ago(ageOf(j.gate_opened_at))}</span></div>
    <div class="repo">${esc(j.repo)} · ${esc(j.id)}</div>
    <div class="reason">⚠ ${esc(j.gate_text)}</div>
    ${rawDetail(j.gate_detail)}
    <div class="links">${link(j.gate_card_url || j.tracker_url, "Card no Plane")}${prLink(j)}</div>
  </article>`).join("") || '<div class="empty">Nada esperando por você.</div>';
}

function renderStuck() {
  const byId = new Map(jobs.jobs.map((j) => [j.id, j]));
  $("stuck-n").textContent = stuck.length;
  $("stuck-list").innerHTML = stuck.map((s) => {
    const j = byId.get(s.job) || {};
    return `<article class="item stuck" data-id="${esc(s.job)}">
    <div class="top"><span class="title">${esc(s.title)}</span><span class="age">há ${ago(s.age_min * 60)}</span></div>
    <div class="repo">${esc(j.repo || s.repo)} · ${esc(s.job)}</div>
    <div class="reason">✕ ${esc(s.reason_pt)}</div>
    ${rawDetail(s.reason)}
    <div class="links">${link(j.tracker_url, "Card no Plane")}${prLink(j)}${j.terminal ? `<code>terminal ${esc(j.terminal)}</code>` : ""}</div>
  </article>`;
  }).join("") || '<div class="empty">Nada parado.</div>';
}

const FLOW_STAGES = ["build", "checks", "review", "judge", "ship"];
const minutes = (m) => (m < 90 ? `${Math.round(m)} min` : ago(m * 60));

function timeline(j) {
  const spent = metrics.stage_minutes[j.id] || {};
  const stages = [...new Set([...FLOW_STAGES, ...Object.keys(spent).filter((s) => spent[s] > 0 && !FLOW_STAGES.includes(s))])];
  if (!stages.includes(j.stage)) stages.push(j.stage);
  return `<div class="stages">${stages.map((s) => {
    const now = s === j.stage;
    const t = now ? `${minutes(j.stage_age_min)} aqui` : spent[s] ? minutes(spent[s]) : "–";
    return `<div class="stg ${now ? "now" : spent[s] ? "" : "idle"}" title="${esc(STAGE_PT[s] || s)}: ${esc(t)}">${esc(STAGE_PT[s] || s)}<b>${esc(t)}</b></div>`;
  }).join("")}</div>`;
}

function renderFlow() {
  const open = jobs.jobs.filter((j) => !["done", "cancelled"].includes(j.stage));
  $("flow-n").textContent = open.length;
  const byRepo = Map.groupBy(open, (j) => j.repo);
  $("flow-list").innerHTML = [...byRepo].sort(([a], [b]) => a.localeCompare(b)).map(([repo, list]) => `<div class="repo-h">${esc(repo)} <span class="age">${list.length} aberto${list.length > 1 ? "s" : ""}</span></div>${list.map((j) => `<article class="item job" tabindex="0" role="button" data-id="${esc(j.id)}">
    <div class="top"><span class="title">${esc(j.title)}</span><span class="age">${esc(j.id)}${j.gate ? ' <span class="mark">⚠ gate</span>' : ""}${j.judge_rounds ? ` <span class="mark" title="rodadas de retrabalho do Judge">↺ ${j.judge_rounds}</span>` : ""}${j.conflicts ? ` <span class="mark" title="conflitos com a main">⚡ ${j.conflicts}</span>` : ""}</span></div>
    ${timeline(j)}
  </article>`).join("")}`).join("") || '<div class="empty">Nenhum job em andamento.</div>';
}

function renderQueue() {
  const rows = Object.entries(queue.projects || {}).flatMap(([project, p]) =>
    p.error ? [`<div class="q"><span>${esc(p.identifier || project)}</span><span class="why bad">erro: ${esc(p.error)}</span></div>`]
      : (p.cards || []).map((c) => `<div class="q"><span><code>${esc(c.key)}</code> ${esc(c.title)}</span><span class="why ${c.decision === "launch_failed" ? "bad" : ""}">${esc(c.decision_text)}</span></div>`));
  $("queue-n").textContent = rows.length;
  $("queue-list").innerHTML = rows.join("") || `<div class="empty">${queue.missing ? "Sem leitura da fila ainda." : "Fila vazia."}</div>`;
}

function renderDone() {
  const list = jobs.jobs.filter((j) => j.merged_at).sort((a, b) => (a.merged_at < b.merged_at ? 1 : -1)).slice(0, 20);
  $("done-n").textContent = list.length;
  $("done-list").innerHTML = list.map((j) => `<div class="done-row job" tabindex="0" role="button" data-id="${esc(j.id)}"><span>${esc(j.repo)} · ${esc(j.title)}</span><span class="age">lead ${minutes(j.lead_min)}</span></div>`).join("") || '<div class="empty">Nada concluído ainda.</div>';
}

const eventNote = (e) => e.note || e.check || e.reason || (e.total != null ? `US$ ${e.total}` : "");
async function showJob(id) {
  openJob = id;
  const d = $("drawer");
  d.classList.add("open");
  d.setAttribute("aria-hidden", "false");
  d.innerHTML = '<button class="close" aria-label="Fechar">×</button><div class="empty">Carregando…</div>';
  try {
    const j = await getJSON("/api/jobs/" + encodeURIComponent(id));
    if (openJob !== id) return;
    const term = j.links?.terminal;
    d.innerHTML = `<button class="close" aria-label="Fechar">×</button>
      <h3>${esc(j.title)}</h3>
      <div class="repo">${esc(j.repo)} · ${esc(j.id)} · ${esc(STAGE_PT[j.stage] || j.stage)}</div>
      <div class="links" style="margin:8px 0">${link(j.tracker_url, "Card no Plane")}${j.links?.pr ? (j.pr_url ? link(j.pr_url, `PR #${esc(j.links.pr)}`) : `PR #${esc(j.links.pr)}`) : ""}${term ? `<code>terminal ${esc(term)}</code>` : ""}</div>
      <h2>Veredictos do Judge <b>${j.verdicts.length}</b></h2>
      ${j.verdicts.map((v) => `<div class="verdict ${esc(v.decision)}"><b>${v.decision === "approved" ? "aprovado" : "reprovado"}</b> · ${esc(new Date(v.at).toLocaleString("pt-BR"))}<ul>${v.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>`).join("") || '<div class="empty">Nenhum ainda.</div>'}
      <h2 style="margin-top:14px">Histórico <b>${j.history.length}</b></h2>
      ${[...j.history].reverse().map((e) => `<div class="ev"><time>${esc(new Date(e.at).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }))}</time><span>${esc(e.event)} <span class="age">→ ${esc(STAGE_PT[e.stage] || e.stage)}</span></span>${eventNote(e) ? `<span class="note">${esc(eventNote(e))}</span>` : ""}</div>`).join("")}`;
  } catch (_) {
    d.innerHTML = '<button class="close" aria-label="Fechar">×</button><div class="empty">Não consegui carregar o histórico.</div>';
  }
}
function closeJob() { openJob = null; $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); }
document.addEventListener("click", (e) => {
  if (e.target.closest("#drawer .close")) return closeJob();
  if (e.target.closest("a, summary")) return;
  const row = e.target.closest(".job");
  if (row) showJob(row.dataset.id);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeJob();
  else if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("job")) { e.preventDefault(); showJob(e.target.dataset.id); }
});

function render() { renderStrip(); renderFlow(); renderQueue(); renderNeeds(); renderStuck(); renderDone(); }

async function getJSON(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
async function loadHealth() {
  try { health = await getJSON("/api/health"); } catch (_) { /* keep what is shown */ }
  renderStrip();
}
async function loadStuck() {
  try {
    metrics = await getJSON("/api/metrics");
    stuck = metrics.stuck.filter((s) => s.kind === "stage"); // gates are already under "Precisa de você"
  } catch (_) { /* keep what is shown */ }
  render();
}
async function loadQueue() {
  try { queue = await getJSON("/api/queue"); } catch (_) { /* keep what is shown */ }
  renderQueue();
}

// --- Como estamos trabalhando ---------------------------------------------------------------------------------
let work = null;
let windowDays = 7;
const hidden = new Set(); // repos filtered out of the throughput chart
const repoName = (r) => String(r).split("/").filter(Boolean).pop() || r;
const dur = (m) => (m == null ? "–" : m < 60 ? `${Math.round(m)} min` : m < 2880 ? `${(m / 60).toFixed(1).replace(".0", "")} h` : `${(m / 1440).toFixed(1).replace(".0", "")} d`);
const pct = (v) => (v == null ? "–" : `${Math.round(v * 100)}%`);
const num = (v) => (v == null ? "–" : (Math.round(v * 10) / 10).toString());
const usd = (v) => `US$ ${v.toFixed(2)}`;
const STAGE_PT = { discovery: "descoberta", spec: "especificação", build: "construção", checks: "CI", review: "revisão", judge: "Judge", ship: "entrega" };
const STAGE_ORDER = Object.keys(STAGE_PT);
const GATE_PT = { merge_review: "Revisar merge", cost: "Orçamento estourado", judge_rounds: "Judge reprovou várias vezes", judge_error: "Judge falhou", launch_failed: "Falha ao lançar", rework_needed: "Retrabalho pendente", merge_conflict: "Conflito com a main" };
const color = (i) => `var(--c${(i % 6) + 1})`;

function infoTile(label, value, hint) {
  return `<button type="button" class="tile" title="${esc(hint)}" aria-label="${esc(label)}: ${esc(value)}. ${esc(hint)}"><small>${esc(label)}</small><b>${esc(value)}</b><span class="hint">${esc(hint)}</span></button>`;
}

// Draw at the real pixel width so the 10px labels stay 10px on a phone (a fixed viewBox would shrink them).
const svgWidth = (id) => Math.min(720, Math.max(280, $(id).clientWidth || 720));

function throughputSvg(days, repos) {
  const shown = repos.filter((r) => !hidden.has(r));
  const W = svgWidth("w-throughput"), H = 170, L = 26, B = 22, T = 14, plot = H - B - T;
  const totals = days.map((d) => shown.reduce((n, r) => n + (d.by_repo[r] || 0), 0));
  const max = Math.max(1, ...totals);
  const slot = (W - L) / days.length, bw = Math.max(2, slot * 0.7);
  const every = Math.ceil(days.length / 8);
  let bars = "";
  days.forEach((d, i) => {
    let y = H - B;
    const x = L + i * slot + (slot - bw) / 2;
    shown.forEach((r) => {
      const n = d.by_repo[r] || 0;
      if (!n) return;
      const h = (n / max) * plot;
      y -= h;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${color(repos.indexOf(r))}"><title>${esc(d.date)} · ${esc(repoName(r))}: ${n}</title></rect>`;
    });
    if (totals[i]) bars += `<text class="val" x="${(x + bw / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="middle">${totals[i]}</text>`;
    if (i % every === 0 || i === days.length - 1) bars += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(d.date.slice(5))}</text>`;
  });
  const total = totals.reduce((a, b) => a + b, 0);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="tp-t tp-d"><title id="tp-t">Merges por dia</title>
    <desc id="tp-d">Gráfico de barras: ${total} merges em ${days.length} dias${shown.length < repos.length ? ", com filtro de repos" : ""}. Máximo de ${max} num dia.</desc>
    <line class="axis" x1="${L}" x2="${W}" y1="${H - B}" y2="${H - B}"/><text x="${L - 4}" y="${T + 4}" text-anchor="end">${max}</text><text x="${L - 4}" y="${H - B}" text-anchor="end">0</text>${bars}</svg>
    <p class="sum">${total} merges em ${days.length} dias${total ? "" : " (nenhum no período)"}.</p>`;
}

function stagesSvg(summary) {
  const W = svgWidth("w-stages");
  const rows = STAGE_ORDER.filter((s) => summary[s]).map((s) => [s, summary[s].median_min]);
  if (!rows.length) return '<div class="empty">sem dados</div>';
  const max = Math.max(1, ...rows.map((r) => r[1]));
  const rowH = 22, L = 96, H = rows.length * rowH + 4;
  const body = rows.map(([s, m], i) => {
    const w = Math.max(2, (m / max) * Math.max(40, W - L - 70));
    const y = i * rowH + 3;
    return `<text x="${L - 6}" y="${y + 12}" text-anchor="end">${STAGE_PT[s]}</text><rect x="${L}" y="${y}" width="${w.toFixed(1)}" height="14" rx="2" fill="var(--c1)"><title>${STAGE_PT[s]}: mediana ${dur(m)}</title></rect><text class="val" x="${(L + w + 6).toFixed(1)}" y="${y + 12}">${dur(m)}</text>`;
  }).join("");
  const longest = rows.reduce((a, b) => (b[1] > a[1] ? b : a));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="st-t st-d"><title id="st-t">Mediana de tempo por etapa</title>
    <desc id="st-d">Barras horizontais com a mediana de minutos em cada etapa. Maior espera: ${STAGE_PT[longest[0]]}, ${dur(longest[1])}.</desc>${body}</svg>
    <p class="sum">Onde o trabalho espera: ${rows.map(([s, m]) => `${STAGE_PT[s]} ${dur(m)}`).join(" · ")}.</p>`;
}

function renderWork() {
  if (!work) { $("w-throughput").innerHTML = '<div class="empty">carregando…</div>'; return; }
  const f = work.flow, q = work.quality;
  const days = f.merged_per_day;
  const repos = [...new Set(days.flatMap((d) => Object.keys(d.by_repo)))].sort();
  $("w-legend").innerHTML = repos.map((r) => `<button type="button" data-repo="${esc(r)}" aria-pressed="${!hidden.has(r)}"><i style="background:${color(repos.indexOf(r))}"></i>${esc(repoName(r))}</button>`).join("");
  $("w-throughput").innerHTML = throughputSvg(days, repos);
  const lt = f.lead_time.overall;
  $("w-lead").innerHTML = [
    infoTile("Lead time (mediana)", dur(lt.median_min), "Da criação do job até o merge: metade dos jobs levou menos que isto."),
    infoTile("Lead time (p90)", dur(lt.p90_min), "9 em cada 10 jobs terminam em menos que isto: mostra os casos lentos."),
    infoTile("Merges", lt.count, `Jobs com merge nos últimos ${work.window_days} dias.`),
  ].join("");
  $("w-stages").innerHTML = stagesSvg(work.stage_summary);
  $("w-quality").innerHTML = [
    infoTile("Judge de primeira", pct(q.judge_first_pass_rate), "Parte dos PRs que o Judge aprovou na primeira revisão, sem retrabalho."),
    infoTile("Rodadas de retrabalho", num(q.mean_rework_rounds), "Média de reprovações do Judge por PR revisado: quanto menor, melhor."),
    infoTile("CI vermelho", pct(q.ci_red_rate), `Parte dos jobs ativos com ao menos um CI vermelho (${q.red_events} ocorrências).`),
    infoTile("Conflitos", q.conflicts_sent, "Quantas vezes o PR conflitou com a main e o worker foi avisado."),
  ].join("");
  const gates = Object.entries(q.gates_opened);
  $("w-gates").innerHTML = gates.length
    ? `<table class="t"><thead><tr><th>Motivo</th><th title="Gates abertos no período">Abertos</th><th title="Tempo mediano até você resolver">Mediana até resolver</th></tr></thead><tbody>${gates.map(([r, g]) => `<tr><td>${esc(GATE_PT[r] || r)}</td><td>${g.count}</td><td>${g.median_resolve_min == null ? "ainda aberto" : dur(g.median_resolve_min)}</td></tr>`).join("")}</tbody></table>
       <p class="sum">Quanto o trabalho esperou por você: cada gate abre quando a fábrica precisa de uma decisão sua.</p>`
    : '<div class="empty">Nenhum gate no período.</div>';
  const c = work.cost;
  $("w-cost").innerHTML = c.total_usd > 0
    ? `<table class="t"><tbody>${Object.entries(c.by_repo).map(([r, v]) => `<tr><td>${esc(repoName(r))}</td><td>${v > 0 ? usd(v) : "sem dados"}</td></tr>`).join("")}</tbody><tfoot><tr><th>Total</th><th>${usd(c.total_usd)}</th></tr></tfoot></table><p class="sum">Soma dos custos registrados nos jobs, por repo.</p>`
    : '<div class="empty">sem dados</div>';
}

async function loadWork() {
  try { work = await getJSON(`/api/metrics?window=${windowDays}`); } catch (_) { /* keep what is shown */ }
  renderWork();
}
$("work").addEventListener("click", (e) => {
  const w = e.target.closest("[data-window]");
  if (w) {
    windowDays = Number(w.dataset.window);
    document.querySelectorAll("[data-window]").forEach((b) => b.setAttribute("aria-pressed", String(b === w)));
    loadWork();
    return;
  }
  const r = e.target.closest("[data-repo]");
  if (r) { hidden.has(r.dataset.repo) ? hidden.delete(r.dataset.repo) : hidden.add(r.dataset.repo); renderWork(); return; }
  const t = e.target.closest("button.tile");
  if (t) t.classList.toggle("show");
});
window.addEventListener("resize", renderWork);
loadWork();
setInterval(loadWork, 60000);

function setLive(on) {
  $("live").classList.toggle("on", on);
  $("live").textContent = on ? "● ao vivo" : "○ offline";
}

const source = new EventSource("/api/events");
source.onopen = () => setLive(true);
source.onerror = () => setLive(false);
source.addEventListener("jobs", (e) => { setLive(true); jobs = JSON.parse(e.data); render(); loadStuck(); loadHealth(); });
loadHealth();
loadQueue();
setInterval(loadHealth, 15000);
setInterval(loadQueue, 30000);
setInterval(render, 15000); // ages tick between events
</script>
</body>
</html>
