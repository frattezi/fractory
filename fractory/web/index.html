<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractory board</title>
<style>
:root {
  --bg: #f4f5f3; --panel: #e9ecea; --card: #ffffff; --text: #1b2124; --muted: #5d6a6e;
  --line: #d3d9d7; --accent: #1f6f78; --warm: #c9822f; --gate: #c0392b; --live: #2e9e5b;
  --shadow: 0 1px 2px rgba(27, 33, 36, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b2124; --panel: #232b2f; --card: #2b3539; --text: #e8ecea; --muted: #94a3a7;
    --line: #36434a; --accent: #4ab3be; --warm: #e3a35f; --gate: #ef6b5b; --live: #4cc37f;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
h1 span { color: var(--accent); }
.stats { display: flex; gap: 20px; flex-wrap: wrap; }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
.stat.warm b { color: var(--warm); }
.stat.gate b { color: var(--gate); }
.controls { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
select, label { font: inherit; color: var(--text); }
select { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.live { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.live i { width: 9px; height: 9px; border-radius: 50%; background: var(--gate); }
.live.on i { background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 25%, transparent); }
main { display: flex; gap: 12px; padding: 16px 20px 28px; overflow-x: auto; align-items: flex-start; }
.col { flex: 0 0 232px; background: var(--panel); border-radius: 10px; padding: 10px; min-height: 120px; }
.col h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); display: flex; justify-content: space-between; }
.col.cancelled { opacity: .8; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; box-shadow: var(--shadow); }
.card.gated { border: 2px solid var(--gate); padding: 9px; }
.card.moved { animation: moved 2.4s ease-out; }
@keyframes moved { 0%, 40% { background: color-mix(in srgb, var(--accent) 28%, var(--card)); transform: scale(1.02); } 100% { background: var(--card); transform: none; } }
.id { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.title { font-weight: 600; margin: 3px 0 6px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; color: var(--muted); font-size: 12px; }
.badge { padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 600; border: 1px solid var(--accent); color: var(--accent); }
.badge.able { border-color: var(--warm); color: var(--warm); }
.cost { color: var(--warm); font-variant-numeric: tabular-nums; }
.links { margin-top: 6px; display: flex; gap: 10px; font-size: 12px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.gate-box { margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: color-mix(in srgb, var(--gate) 12%, transparent); font-size: 12px; }
.gate-box b { color: var(--gate); }
.empty { color: var(--muted); font-size: 12px; padding: 4px 2px; }
.card { cursor: pointer; }
.card:focus-visible { outline: 2px solid var(--accent); }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 5; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--bg); border-left: 1px solid var(--line); z-index: 6; overflow-y: auto; padding: 16px 18px 28px; box-shadow: -4px 0 16px rgba(0, 0, 0, .15); }
.panel[hidden], .scrim[hidden] { display: none; }
.panel h3 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.panel .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel .head .title { font-size: 16px; margin: 2px 0 6px; }
.close { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-size: 16px; line-height: 1; padding: 4px 9px; cursor: pointer; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 3px 10px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.tl { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
.tl li { position: relative; padding: 0 0 10px 8px; font-size: 13px; }
.tl li::before { content: ""; position: absolute; left: -20px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tl li small { color: var(--muted); display: block; }
.tl .note { color: var(--muted); overflow-wrap: anywhere; }
.verdict { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--live); border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; font-size: 13px; }
.verdict.rejected { border-left-color: var(--gate); }
.verdict ul { margin: 4px 0 0; padding-left: 18px; }
.spark { width: 100%; height: 48px; display: block; }
.spark polyline { fill: none; stroke: var(--warm); stroke-width: 2; vector-effect: non-scaling-stroke; }
.costs { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin: 4px 0 0; padding: 0; list-style: none; }

/* --- activity feed --- */
body.feed-open main { margin-right: 340px; }
.feed { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; background: var(--panel); border-left: 1px solid var(--line); z-index: 4; display: flex; flex-direction: column; }
.feed[hidden] { display: none; }
.feed-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 650; }
.feed-body { overflow-y: auto; padding: 8px 10px 20px; flex: 1; }
.feed-toggle { position: fixed; right: 12px; bottom: 12px; z-index: 4; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; cursor: pointer; font: inherit; box-shadow: var(--shadow); }
body.feed-open .feed-toggle { display: none; }
.ev { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 6px; padding: 6px 9px; margin-bottom: 6px; cursor: pointer; }
.ev:hover { border-color: var(--accent); }
.ev.hl { border-left-color: var(--accent); }
.ev.hl.bad { border-left-color: var(--gate); }
.ev.hl.good { border-left-color: var(--live); }
.ev.hl.warn { border-left-color: var(--warm); }
.ev b { font-size: 13px; } .ev small { color: var(--muted); display: block; font-size: 11px; }
.ev .note { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.feed-body h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.feed-log { margin: 0; font: 11px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 900px) { body.feed-open main { margin-right: 0; } }
@media (max-width: 640px) {
  .feed { top: auto; left: 0; width: auto; height: 55vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; box-shadow: 0 -4px 16px rgba(0, 0, 0, .15); }
}
@media (max-width: 640px) { header { padding: 12px; } main { padding: 12px; } .controls { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>Frac<span>tory</span></h1>
  <div class="stats">
    <div class="stat"><b id="s-open">–</b><small>open jobs</small></div>
    <div class="stat gate"><b id="s-gates">–</b><small>open gates</small></div>
    <div class="stat warm"><b id="s-cost">–</b><small>total cost</small></div>
  </div>
  <div class="controls">
    <label>Repo <select id="repo"><option value="">all</option></select></label>
    <label><input type="checkbox" id="show-cancelled"> cancelled</label>
    <span class="live" id="live"><i></i><span>offline</span></span>
  </div>
</header>
<main id="board"></main>
<aside class="feed" id="feed" aria-label="Activity"><div class="feed-head"><span>Activity</span><button class="close" id="feed-close" aria-label="Hide activity">×</button></div><div class="feed-body" id="feed-body"></div></aside>
<button class="feed-toggle" id="feed-toggle">Activity</button>
<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" role="dialog" aria-label="Job detail" hidden></aside>
<script>
const STAGES = ["discovery", "spec", "build", "checks", "review", "judge", "ship", "done"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (n) => "US$ " + Number(n).toFixed(2);
let data = null;
let stageOf = new Map();
let moved = new Set();

const link = (url, text) => (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : "");

function card(j) {
  const prLabel = j.pr ? `PR #${esc(j.pr)}` : "";
  const prLink = j.pr ? (j.pr_url ? link(j.pr_url, prLabel) : `<span>${prLabel}</span>`) : "";
  const gate = j.gate
    ? `<div class="gate-box"><b>Gate: ${esc(j.gate)}</b>${j.gate_detail ? `<div>${esc(j.gate_detail)}</div>` : ""}</div>`
    : "";
  return `<article class="card${j.gate ? " gated" : ""}${moved.has(j.id) ? " moved" : ""}" data-id="${esc(j.id)}" tabindex="0">
    <div class="id"><span>${esc(j.id)}</span><span>${esc(j.repo)}</span></div>
    <div class="title">${esc(j.title)}</div>
    <div class="meta">
      <span class="badge${j.kind === "able" ? " able" : ""}">${j.kind === "able" ? "Able" : "internal"}</span>
      <span class="cost">${money(j.cost_usd)} / ${Number(j.budget_usd).toFixed(0)}</span>
      <span>judge ${j.judge_rounds}/2</span>
    </div>
    ${gate}
    <div class="links">${prLink}${link(j.tracker_url, "Plane")}</div>
  </article>`;
}

function render() {
  if (!data) return;
  const repo = $("repo").value;
  const repos = [...new Set(data.jobs.map((j) => j.repo))].sort();
  $("repo").innerHTML = '<option value="">all</option>' + repos.map((r) => `<option${r === repo ? " selected" : ""}>${esc(r)}</option>`).join("");
  const jobs = data.jobs.filter((j) => !repo || j.repo === repo);
  const showCancelled = $("show-cancelled").checked;
  const stages = showCancelled ? [...STAGES, "cancelled"] : STAGES;
  $("board").innerHTML = stages
    .map((stage) => {
      const items = jobs.filter((j) => j.stage === stage).sort((a, b) => (a.updated_at < b.updated_at ? 1 : -1));
      return `<section class="col ${stage}"><h2><span>${stage}</span><span>${items.length}</span></h2>${
        items.map(card).join("") || '<div class="empty">–</div>'
      }</section>`;
    })
    .join("");
  const t = data.totals;
  $("s-open").textContent = t.open;
  $("s-gates").textContent = t.gated;
  $("s-cost").textContent = money(t.cost_usd);
}

function update(next) {
  const before = openId && data && data.jobs.find((j) => j.id === openId);
  const after = openId && next.jobs.find((j) => j.id === openId);
  if (openId && (!before || !after || before.updated_at !== after.updated_at)) loadDetail();
  moved = new Set();
  for (const j of next.jobs) {
    if (stageOf.has(j.id) && stageOf.get(j.id) !== j.stage) moved.add(j.id);
  }
  stageOf = new Map(next.jobs.map((j) => [j.id, j.stage]));
  data = next;
  render();
  if (moved.size) setTimeout(() => { moved = new Set(); }, 2500);
}

function setLive(on) {
  $("live").classList.toggle("on", on);
  $("live").lastElementChild.textContent = on ? "live" : "offline";
}

$("repo").addEventListener("change", render);
$("show-cancelled").addEventListener("change", render);

// --- detail panel: #job=<id> ---
let openId = null;
let detail = null;
const when = (iso) => String(iso ?? "").replace("T", " ").slice(0, 19);

function costSpark(costs) {
  if (!costs.length) return '<div class="empty">no cost yet</div>';
  const max = Math.max(...costs.map((c) => c.total)) || 1;
  const pts = costs.map((c, i) => `${costs.length === 1 ? 50 : (i / (costs.length - 1)) * 100},${46 - (c.total / max) * 44}`).join(" ");
  const line = costs.length === 1 ? `<circle cx="50" cy="${46 - (costs[0].total / max) * 44}" r="2" fill="var(--warm)"/>` : `<polyline points="${pts}"/>`;
  return `<svg class="spark" viewBox="0 0 100 48" preserveAspectRatio="none" aria-hidden="true">${line}</svg>
    <ul class="costs">${costs.map((c) => `<li>${esc(when(c.at))} · +${money(c.usd)} → ${money(c.total)}</li>`).join("")}</ul>`;
}

function panelHtml(d) {
  const l = d.links || {};
  const rows = [
    ["worktree", l.worktree && esc(l.worktree)], ["terminal", l.terminal && esc(l.terminal)], ["branch", l.branch && esc(l.branch)],
    ["PR", l.pr && (d.pr_url ? link(d.pr_url, `#${esc(l.pr)}`) : `#${esc(l.pr)}`)], ["Plane", link(d.tracker_url, "issue")],
  ].filter(([, v]) => v);
  const verdicts = d.verdicts.map((v) => `<div class="verdict ${esc(v.decision)}"><b>${esc(v.decision)}</b> <small>${esc(when(v.at))}</small>
    <ul>${v.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>`).join("") || '<div class="empty">no verdicts yet</div>';
  const timeline = d.history.map((e) => {
    const extra = e.note || e.check || e.reason || (e.event === "cost" ? `+${money(e.usd)}` : "");
    return `<li><b>${esc(e.event)}</b> · ${esc(e.stage)}<small>${esc(when(e.at))}</small>${extra ? `<div class="note">${esc(extra)}</div>` : ""}</li>`;
  }).reverse().join("");
  return `<div class="head"><div><div class="id"><span>${esc(d.id)}</span></div><div class="title">${esc(d.title)}</div>
    <div class="meta"><span class="badge${d.kind === "able" ? " able" : ""}">${d.kind === "able" ? "Able" : "internal"}</span><span>${esc(d.stage)}</span>
    <span class="cost">${money(d.cost_usd)} / ${Number(d.budget_usd).toFixed(0)}</span><span>judge ${d.judge_rounds}/2</span></div></div>
    <button class="close" id="close" aria-label="Close">×</button></div>
    ${d.gate ? `<div class="gate-box"><b>Gate: ${esc(d.gate.reason)}</b>${d.gate.detail ? `<div>${esc(d.gate.detail)}</div>` : ""}</div>` : ""}
    <h3>Links</h3><dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("") || '<dt></dt><dd>none</dd>'}</dl>
    <h3>Judge verdicts</h3>${verdicts}
    <h3>Cost over time</h3>${costSpark(d.history.filter((e) => e.event === "cost"))}
    <h3>Timeline</h3><ol class="tl">${timeline}</ol>`;
}

async function loadDetail() {
  if (!openId) return;
  const id = openId;
  try {
    const r = await fetch("/api/jobs/" + encodeURIComponent(id));
    if (id !== openId) return;
    if (!r.ok) { $("panel").innerHTML = `<div class="head"><b>${esc(id)}: not found</b><button class="close" id="close">×</button></div>`; return; }
    detail = await r.json();
    const keep = $("panel").scrollTop;
    $("panel").innerHTML = panelHtml(detail);
    $("panel").scrollTop = keep;
  } catch (_) { /* offline: keep what is shown */ }
}

function syncPanel() {
  const m = location.hash.match(/^#job=([a-z0-9][a-z0-9-]*)$/);
  const id = m ? m[1] : null;
  if (id === openId) return;
  openId = id;
  detail = null;
  $("panel").hidden = $("scrim").hidden = !id;
  if (id) { $("panel").innerHTML = ""; loadDetail(); }
}

const closePanel = () => { history.replaceState(null, "", location.pathname + location.search); syncPanel(); };
$("board").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const c = e.target.closest(".card");
  if (c) location.hash = "job=" + c.dataset.id;
});
$("board").addEventListener("keydown", (e) => {
  const c = e.target.closest(".card");
  if (c && e.key === "Enter") location.hash = "job=" + c.dataset.id;
});
$("panel").addEventListener("click", (e) => { if (e.target.closest("#close")) closePanel(); });
$("scrim").addEventListener("click", closePanel);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openId) closePanel(); });
window.addEventListener("hashchange", syncPanel);
syncPanel();

// --- activity feed ---
const TONE = { red: "bad", rejected: "bad", gate_opened: "bad", rework_sent: "warn", merged: "good", created: "" };
function setFeedOpen(open) {
  $("feed").hidden = !open;
  document.body.classList.toggle("feed-open", open);
  try { localStorage.setItem("fractory.feed", open ? "1" : "0"); } catch (_) { /* storage blocked */ }
  if (open) loadActivity();
}
async function loadActivity() {
  if ($("feed").hidden) return;
  try {
    const r = await fetch("/api/activity?limit=50");
    if (!r.ok) return;
    const a = await r.json();
    const items = a.events.map((e) => `<button class="ev${e.highlight ? " hl " + (TONE[e.event] ?? "") : ""}" data-id="${esc(e.job)}">
      <b>${esc(e.event)}</b> · ${esc(e.job)}${e.stage ? " · " + esc(e.stage) : ""}<small>${esc(e.title)} · ${esc(when(e.at))}</small>
      ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}</button>`).join("") || '<div class="empty">no activity yet</div>';
    const log = a.log.length ? `<h3>watch.log</h3><pre class="feed-log">${esc(a.log.join("\n"))}</pre>` : "";
    const keep = $("feed-body").scrollTop;
    $("feed-body").innerHTML = items + log;
    $("feed-body").scrollTop = keep;
  } catch (_) { /* offline: keep what is shown */ }
}
$("feed-toggle").addEventListener("click", () => setFeedOpen(true));
$("feed-close").addEventListener("click", () => setFeedOpen(false));
$("feed-body").addEventListener("click", (e) => {
  const b = e.target.closest(".ev");
  if (b) location.hash = "job=" + b.dataset.id;
});
let feedPref = null;
try { feedPref = localStorage.getItem("fractory.feed"); } catch (_) { /* storage blocked */ }
setFeedOpen(feedPref !== "0" && !(feedPref === null && matchMedia("(max-width: 640px)").matches));
setInterval(loadActivity, 30000);

const source = new EventSource("/api/events");
source.onopen = () => setLive(true);
source.onerror = () => setLive(false);
source.addEventListener("jobs", (e) => { setLive(true); update(JSON.parse(e.data)); loadActivity(); });
</script>
</body>
</html>
