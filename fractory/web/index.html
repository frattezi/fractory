<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractory</title>
<style>
:root {
  --bg: #f4f5f3; --card: #ffffff; --text: #1b2124; --muted: #5d6a6e; --line: #d3d9d7;
  --accent: #1f6f78; --bad: #b3261e; --warn: #8a5300; --ok: #1d7a45;
  --shadow: 0 1px 2px rgba(27, 33, 36, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b2124; --card: #2b3539; --text: #e8ecea; --muted: #a0aeb2; --line: #36434a;
    --accent: #4ab3be; --bad: #ff8a7d; --warn: #e3a35f; --ok: #5fd08f; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
h1 { margin: 0; font-size: 18px; font-weight: 650; }
h1 span { color: var(--accent); }
h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
h2 b { color: var(--text); font-variant-numeric: tabular-nums; }
main { padding: 0 16px 28px; max-width: 1100px; margin: 0 auto; }
section { margin-top: 20px; }
a { color: var(--accent); }
.live { font-size: 12px; color: var(--muted); }
.live.on { color: var(--ok); }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 0 16px; max-width: 1100px; }
@media (min-width: 1132px) { .strip { margin: 0 auto; } }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-shadow: var(--shadow); min-width: 0; }
.tile small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
.tile b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile.bad { border-color: var(--bad); } .tile.bad b { color: var(--bad); }
.tile.warn b { color: var(--warn); }
.tile.ok b { color: var(--ok); }
.tile code { font: 13px ui-monospace, Menlo, monospace; }
.item { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.item.stuck { border-left-color: var(--bad); }
.item .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.item .title { font-weight: 600; overflow-wrap: anywhere; }
.item .repo, .item .age { color: var(--muted); font-size: 12px; }
.item .reason { margin: 4px 0; overflow-wrap: anywhere; }
.item .links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.item code { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
.raw { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
.raw summary { cursor: pointer; }
.empty { color: var(--muted); padding: 8px 2px; }
</style>
</head>
<body>
<header>
  <h1>Frac<span>tory</span></h1>
  <span class="live" id="live">○ offline</span>
</header>
<div class="strip" id="strip" aria-label="Saúde da fábrica"></div>
<main>
  <section id="needs" aria-labelledby="needs-h"><h2 id="needs-h">Precisa de você <b id="needs-n">–</b></h2><div id="needs-list"></div></section>
  <section id="stuck" aria-labelledby="stuck-h"><h2 id="stuck-h">Parado <b id="stuck-n">–</b></h2><div id="stuck-list"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const link = (url, text) => (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : "");

let jobs = { jobs: [], wip: { open: 0, max: 0 } };
let health = { missing: true };
let stuck = [];

function ago(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s < 90) return `${s} s`;
  const m = Math.round(s / 60);
  if (m < 90) return `${m} min`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h} h` : `${Math.round(h / 24)} d`;
}
const ageOf = (iso) => (iso ? (Date.now() - Date.parse(iso)) / 1000 : 0);

// Portuguese wording comes from the server (fractory/pt.py): gate_text and reason_pt. The raw English detail only goes in <details>.
const rawDetail = (text) => (text ? `<details class="raw"><summary>detalhe</summary><code>${esc(text)}</code></details>` : "");

function tile(label, value, tone, icon) {
  return `<div class="tile ${tone || ""}"><small>${label}</small><b>${icon ? icon + " " : ""}${value}</b></div>`;
}

function renderStrip() {
  const gates = jobs.jobs.filter((j) => j.gate).length;
  const stuckN = stuck.length;
  const h = health;
  const watch = h.missing
    ? tile("Watch", "sem sinal", "bad", "✕")
    : h.alive
      ? tile("Watch", "ativo", "ok", "✓")
      : tile("Watch", "parado", "bad", "✕");
  const cycle = h.missing
    ? tile("Último ciclo", "–")
    : tile("Último ciclo", `há ${ago(ageOf(h.cycle_ended_at))} · ${ago(h.duration_seconds ?? 0)}`, h.alive ? "" : "bad", h.alive ? "" : "✕");
  const backoffs = h.missing ? tile("Backoffs Plane", "–") : tile("Backoffs Plane", h.rate_limit_backoffs ?? 0, h.rate_limit_backoffs ? "warn" : "", h.rate_limit_backoffs ? "⚠" : "");
  const wip = jobs.wip;
  $("strip").innerHTML = [
    watch,
    cycle,
    tile("WIP", `${wip.open} / ${wip.max}`, wip.max && wip.open >= wip.max ? "warn" : "", wip.max && wip.open >= wip.max ? "⚠" : ""),
    tile("Gates abertos", gates, gates ? "warn" : "", gates ? "⚠" : ""),
    tile("Parados", stuckN, stuckN ? "bad" : "", stuckN ? "✕" : ""),
    backoffs,
    tile("Código", h.missing || !h.code_sha ? "–" : `<code>${esc(h.code_sha.slice(0, 7))}</code>`),
  ].join("");
}

const prLink = (j) => (j.pr ? (j.pr_url ? link(j.pr_url, `PR #${esc(j.pr)}`) : `PR #${esc(j.pr)}`) : "");

function renderNeeds() {
  const open = jobs.jobs.filter((j) => j.gate).sort((a, b) => (a.gate_opened_at < b.gate_opened_at ? -1 : 1));
  $("needs-n").textContent = open.length;
  $("needs-list").innerHTML = open.map((j) => `<article class="item" data-id="${esc(j.id)}">
    <div class="top"><span class="title">${esc(j.title)}</span><span class="age">há ${ago(ageOf(j.gate_opened_at))}</span></div>
    <div class="repo">${esc(j.repo)} · ${esc(j.id)}</div>
    <div class="reason">⚠ ${esc(j.gate_text)}</div>
    ${rawDetail(j.gate_detail)}
    <div class="links">${link(j.gate_card_url || j.tracker_url, "Card no Plane")}${prLink(j)}</div>
  </article>`).join("") || '<div class="empty">Nada esperando por você.</div>';
}

function renderStuck() {
  const byId = new Map(jobs.jobs.map((j) => [j.id, j]));
  $("stuck-n").textContent = stuck.length;
  $("stuck-list").innerHTML = stuck.map((s) => {
    const j = byId.get(s.job) || {};
    return `<article class="item stuck" data-id="${esc(s.job)}">
    <div class="top"><span class="title">${esc(s.title)}</span><span class="age">há ${ago(s.age_min * 60)}</span></div>
    <div class="repo">${esc(j.repo || s.repo)} · ${esc(s.job)}</div>
    <div class="reason">✕ ${esc(s.reason_pt)}</div>
    ${rawDetail(s.reason)}
    <div class="links">${link(j.tracker_url, "Card no Plane")}${prLink(j)}${j.terminal ? `<code>terminal ${esc(j.terminal)}</code>` : ""}</div>
  </article>`;
  }).join("") || '<div class="empty">Nada parado.</div>';
}

function render() { renderStrip(); renderNeeds(); renderStuck(); }

async function getJSON(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
async function loadHealth() {
  try { health = await getJSON("/api/health"); } catch (_) { /* keep what is shown */ }
  renderStrip();
}
async function loadStuck() {
  try {
    const m = await getJSON("/api/metrics");
    stuck = m.stuck.filter((s) => s.kind === "stage"); // gates are already under "Precisa de você"
  } catch (_) { /* keep what is shown */ }
  render();
}

function setLive(on) {
  $("live").classList.toggle("on", on);
  $("live").textContent = on ? "● ao vivo" : "○ offline";
}

const source = new EventSource("/api/events");
source.onopen = () => setLive(true);
source.onerror = () => setLive(false);
source.addEventListener("jobs", (e) => { setLive(true); jobs = JSON.parse(e.data); render(); loadStuck(); loadHealth(); });
loadHealth();
setInterval(loadHealth, 15000);
setInterval(render, 15000); // ages tick between events
</script>
</body>
</html>
