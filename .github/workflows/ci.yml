name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted on purpose: this repo is public, and self-hosted runners must never serve a public repo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: pipx run ruff==0.17.1 check . && pipx run ruff==0.17.1 format --check .
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
