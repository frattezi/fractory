[project]
name = "fractory"
version = "0.0.1"
description = "Engine and control plane of the agent factory on Orca"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fractory = "fractory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fractory", "fractory.trackers"]

[tool.setuptools.package-data]
fractory = ["rubric.md", "web/index.html"]

[tool.ruff]
line-length = 120
